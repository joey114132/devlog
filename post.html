<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joey Devlog</title>
    <meta name="description" content="Joey의 개발 다이어리" />
    <meta property="og:title" content="Joey Devlog" />
    <meta property="og:description" content="Joey의 개발 다이어리" />
    <meta property="og:type" content="article" />
    <meta name="twitter:card" content="summary" />
    <link rel="alternate" type="application/rss+xml" title="Joey Devlog RSS" href="feed.xml" />
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("devlog-prefs") || "{}");
          if (p.theme === "light" || p.theme === "dark") {
            document.documentElement.dataset.theme = p.theme;
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div id="reading-progress-wrap" class="reading-progress-wrap" aria-hidden="true">
      <div id="reading-progress" class="reading-progress"></div>
    </div>

    <header class="app-header">
      <div class="app-header__inner">
        <div class="brand">
          <h1><a href="index.html">Joey Devlog</a></h1>
        </div>
        <div class="app-actions">
          <a class="header-btn header-btn--write" href="edit.html">
            <span aria-hidden="true">✎</span>
            <span>글쓰기</span>
          </a>
          <button
            type="button"
            class="header-btn header-btn--menu menu-fab"
            id="menu-fab"
            aria-label="설정 메뉴 열기"
            aria-expanded="false"
            aria-controls="prefs-panel"
          >
            <span class="menu-fab-bars" aria-hidden="true">
              <span class="menu-fab-bar"></span>
              <span class="menu-fab-bar"></span>
              <span class="menu-fab-bar"></span>
            </span>
            <span class="menu-fab-label">설정</span>
          </button>
        </div>
      </div>
    </header>

    <div id="prefs-overlay" class="prefs-overlay" hidden></div>
    <aside id="prefs-panel" class="prefs-panel" hidden aria-label="사이트 설정">
      <div class="prefs-panel-header">
        <h2>설정</h2>
        <button type="button" id="prefs-close" class="prefs-close" aria-label="닫기">×</button>
      </div>
      <form class="prefs-form" onsubmit="return false">
        <label class="prefs-field">
          <span>테마</span>
          <select id="pref-theme">
            <option value="system">시스템</option>
            <option value="light">라이트</option>
            <option value="dark">다크</option>
          </select>
        </label>
        <label class="prefs-field">
          <span>글자 크기</span>
          <select id="pref-font-size">
            <option value="sm">작게</option>
            <option value="md">보통</option>
            <option value="lg">크게</option>
          </select>
        </label>
        <label class="prefs-field">
          <span>줄 간격</span>
          <select id="pref-line-height">
            <option value="normal">보통</option>
            <option value="relaxed">넓게</option>
          </select>
        </label>
        <button type="button" id="pref-reset" class="prefs-reset">기본값으로</button>
      </form>
    </aside>

    <main class="page page--article">
      <div class="page__inner layout-article">
        <article id="article" class="article" aria-live="polite">
          <p class="empty">불러오는 중…</p>
        </article>
      </div>
    </main>

    <button type="button" id="back-to-top" class="back-to-top" aria-label="맨 위로">
      ↑
    </button>

    <footer class="site-footer">
      <p class="copyright">© 2026 Joey Lee (이정우). All rights reserved.</p>
      <p class="footer-meta">
        <a href="https://github.com/joey114132/devlog" rel="noopener noreferrer">GitHub</a>
        · <a href="feed.xml">RSS</a>
        · 소스 <code>~/devlogs</code>
      </p>
    </footer>

    <script src="js/prefs.js" defer></script>
    <script src="js/scrum.js" defer></script>
    <script src="js/features.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
