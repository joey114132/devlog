<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>공부 정리 · Joey Devlog</title>
    <meta
      name="description"
      content="Joey의 공부 정리 — ROS, 로봇, 개발 개념을 표와 비유로 정리한 노트"
    />
    <meta property="og:title" content="공부 정리 · Joey Devlog" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joey114132.github.io/devlog/studies.html" />
    <link rel="alternate" type="application/rss+xml" title="Joey Devlog RSS" href="feed.xml" />
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("devlog-prefs") || "{}");
          if (p.theme === "light" || p.theme === "dark") {
            document.documentElement.dataset.theme = p.theme;
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>

    <div id="site-top" class="site-top">
      <header class="app-header">
        <div class="app-header__inner">
          <div class="header-start">
            <div class="brand">
              <h1><a href="index.html">Joey Devlog</a></h1>
              <p class="brand-tagline">공부 정리 — 배운 걸 표로 남기기</p>
            </div>
            <nav class="site-nav" aria-label="주요 메뉴">
              <a class="site-nav__link" href="index.html">다이어리</a>
              <a class="site-nav__link is-active" href="studies.html" aria-current="page">공부 정리</a>
            </nav>
          </div>
          <div class="app-actions">
            <a class="header-btn header-btn--write" href="edit.html">
              <span aria-hidden="true">✎</span>
              <span>글쓰기</span>
            </a>
            <button
              type="button"
              class="header-btn header-btn--menu menu-fab"
              id="menu-fab"
              aria-label="설정 메뉴 열기"
              aria-expanded="false"
              aria-controls="prefs-panel"
            >
              <span class="menu-fab-bars" aria-hidden="true">
                <span class="menu-fab-bar"></span>
                <span class="menu-fab-bar"></span>
                <span class="menu-fab-bar"></span>
              </span>
              <span class="menu-fab-label">설정</span>
            </button>
          </div>
        </div>
      </header>
    </div>

    <div id="prefs-overlay" class="prefs-overlay" hidden></div>
    <aside id="prefs-panel" class="prefs-panel" hidden aria-label="사이트 설정">
      <div class="prefs-panel-header">
        <h2>설정</h2>
        <button type="button" id="prefs-close" class="prefs-close" aria-label="닫기">×</button>
      </div>
      <form class="prefs-form" onsubmit="return false">
        <label class="prefs-field">
          <span>테마</span>
          <select id="pref-theme">
            <option value="system">시스템</option>
            <option value="light">라이트</option>
            <option value="dark">다크</option>
          </select>
        </label>
        <label class="prefs-field">
          <span>글자 크기</span>
          <select id="pref-font-size">
            <option value="sm">작게</option>
            <option value="md">보통</option>
            <option value="lg">크게</option>
          </select>
        </label>
        <label class="prefs-field">
          <span>줄 간격</span>
          <select id="pref-line-height">
            <option value="normal">보통</option>
            <option value="relaxed">넓게</option>
          </select>
        </label>
        <button type="button" id="pref-reset" class="prefs-reset">기본값으로</button>
      </form>
    </aside>

    <main class="page page--studies">
      <div class="page__inner">
        <section class="index-intro" aria-label="공부 정리 소개">
          <p class="index-intro-lead">
            다이어리와 별도로, 공부하면서 정리한 개념·용어를 표로 모아 둡니다. 학교·일상 비유와
            로봇에서의 역할을 나란히 둡니다.
          </p>
        </section>
        <div id="study-list" class="timeline" aria-live="polite">
          <p class="empty">불러오는 중…</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p class="copyright">© 2026 Joey Lee (이정우). All rights reserved.</p>
      <p class="footer-meta">
        <a href="index.html">다이어리</a>
        · <a href="https://github.com/joey114132/devlog" rel="noopener noreferrer">GitHub</a>
        · <a href="feed.xml">RSS</a>
      </p>
    </footer>

    <script src="js/prefs.js" defer></script>
    <script src="js/studies.js" defer></script>
  </body>
</html>
